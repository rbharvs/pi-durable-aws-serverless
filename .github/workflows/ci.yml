name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          enable_kvm: false
          extra_nix_config: |
            access-tokens =
      - run: nix develop --no-update-lock-file --command pnpm install --frozen-lockfile
      - run: nix develop --no-update-lock-file --command pnpm check
      - run: nix develop --no-update-lock-file --command pnpm test
      - run: nix develop --no-update-lock-file --command pnpm test:integration
