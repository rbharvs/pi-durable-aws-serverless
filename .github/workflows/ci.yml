name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          enable_kvm: false
          extra_nix_config: |
            access-tokens =
      - run: nix develop --no-update-lock-file --command pnpm install --frozen-lockfile
      - run: nix develop --no-update-lock-file --command pnpm check
